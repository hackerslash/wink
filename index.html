        Wink is a private AI chat client that runs entirely in your browser. Paste an API key for
        OpenAI, Anthropic, Gemini, OpenRouter, Groq, DeepSeek, Mistral or xAI — or point it at

        no telemetry: conversations, memories and documents live in this device's storage.
